<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Open New Branch</title>
        <link href="{{ url_for('static', filename='styles.css') }}" rel="stylesheet">

    </head>
    <body style="padding-top: 60px; min-height: 80vh;">
        <div class="top-bar">
            <a href="dreamHome.html">
                <div class="home">🏠︎</div>
            </a>
            <div class="title">Dream Home Real Estate</div>
        </div>
        <div class="form-container">
            <div class="section-content">
                <div class="form-row">
                    <div class="form-group">
                        <label for="newBranchNo">Branch No.:</label>
                        <input type="text" id="newBranchNo" value="">
                    </div>
                    <div class="form-group">
                        <label for="newStreet">Street:</label>
                        <input type="text" id="newStreet" value="">
                    </div>
                </div>
                
                <div class="form-row">
                    <div class="form-group">
                        <label for="newCity">City:</label>
                        <input type="text" id="newCity" value="">
                    </div>
                    <div class="form-group">
                        <label for="newPostCode">Postcode:</label>
                        <input type="text" id="newPostCode" value="">
                    </div>
                </div>
            <div class="button-row">
                <a href="branchMainMenu.html">
                    <button type="cancel" class="cancel-button">Cancel</button>
                </a>
                <button type="submit" id="submitButton" class="submit-button">Submit</button>
            </div>
            <p id="message" style="text-align: center; margin-top: 1rem;"></p>
        </div>
        <script src="{{ url_for('static', filename='newBranchForm.js') }}"></script>
    </body>
</html>
