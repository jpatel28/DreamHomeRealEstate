<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Hire Employee</title>
        <link href="{{ url_for('static', filename='styles.css') }}" rel="stylesheet">

    </head>
    <body>
        <div class="top-bar">
            <a href="dreamHome.html">
                <div class="home">🏠︎</div>
            </a>
            <div class="title">Dream Home Real Estate</div>
        </div>
        <div class="form-container">
            <div class="section-content">
                <div class="form-row">
                    <div class="form-group">
                        <label for="staffNo">Staff No.:</label>
                        <input type="text" id="staffNo" value="">
                    </div>
                </div>
                
                <div class="form-row">
                    <div class="form-group">
                        <label for="firstName">First Name:</label>
                        <input type="text" id="firstName" value="">
                    </div>
                    <div class="form-group">
                        <label for="lastName">Last Name:</label>
                        <input type="text" id="lastName" value="">
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="position">Position:</label>
                        <select id="position" name="position">
                            <option value="" selected></option>
                            <option value="Assistant">Assistant</option>
                            <option value="Supervisor">Supervisor</option>
                            <option value="Manager">Manager</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="branchNo">Branch No.:</label>
                        <input type="text" id="branchNo" value="">
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="sex">Sex:</label>
                        <select id="sex" name="sex">
                            <option value="" selected></option>
                            <option value="M">M</option>
                            <option value="F">F</option>
                        </select>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="dob">DOB:</label>
                        <input type="date" id="dob" value="">
                    </div>
                    <div class="form-group">
                        <label for="salary">Salary:</label>
                        <input type="text" id="salary" value="">
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="telephone">Telephone:</label>
                        <input type="text" id="telephone" value="">
                    </div>
                    <div class="form-group">
                        <label for="mobile">Mobile:</label>
                        <input type="text" id="mobile" value="">
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="email">Email:</label>
                        <input type="text" id="email" value="">
                    </div>               
                </div>
            </div>

            <div class="button-row">
                <a href="staffMainMenu.html">
                    <button type="cancel" class="cancel-button">Cancel</button>
                </a>
                <button type="submit" id="hireButton" class="hire-button">Hire</button>
            </div>
            <p id="message" style="text-align: center; margin-top: 1rem;"></p>
        </div>
        <script src="{{ url_for('static', filename='staffHire.js') }}"></script>
    </body>
</html>
