<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Client List</title>
        <link href="{{ url_for('static', filename='styles.css') }}" rel="stylesheet">
    </head>
    <body>
        <div class="top-bar">
            <a href="dreamHome.html">
                <div class="home">🏠︎</div>
            </a>
            <div class="title">Dream Home Real Estate</div>
        </div>
        <div class="list-container">
            <div class="section-content">
                <h2>Client List</h2>
                <div class="table-container">
                    <table id="clientTable">
                        <thead>
                            <tr>
                                <th>Client No.</th>
                                <th>First Name</th>
                                <th>Last Name</th>
                                <th>Telephone</th>
                                <th>Street</th>
                                <th>City</th>
                                <th>Email</th>
                                <th>Property Type</th>
                                <th>Max Rent</th>
                            </tr>
                        </thead>
                        <tbody id="clientTableBody">
                            <!-- Client data will be loaded here -->
                        </tbody>
                    </table>
                </div>
                <div class="button-row">
                    <a href="clientMainMenu.html">
                        <button class="cancel-button">Back to Client Menu</button>
                    </a>
                    <button id="refreshButton" class="hire-button">Refresh List</button>
                </div>
                <p id="message" style="text-align: center; margin-top: 1rem;"></p>
            </div>
        </div>
        <script src="{{ url_for('static', filename='clientList.js') }}"></script>
    </body>
</html>
